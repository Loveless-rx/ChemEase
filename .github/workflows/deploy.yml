name: Deploy ChemEase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test ChemEase
        run: npm test

      - name: Lint ChemEase
        run: npm run lint

      - name: Build ChemEase
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            // Resolve the uploaded artifact through REST; the artifact-service
            // lookup can return an empty list even after a successful upload.
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId
            });
            const artifact = data.artifacts.find(a => a.name === 'github-pages' && !a.expired);
            if (!artifact) throw new Error('The website artifact is missing.');
            const deployment = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifact.id,
              pages_build_version: context.sha, oidc_token: await core.getIDToken()
            });
            core.setOutput('page_url', deployment.data.page_url);
            for (let attempt = 0; attempt < 60; attempt++) {
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                owner, repo, deployment_id: deployment.data.id
              });
              if (result.data.status === 'succeed') return;
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(result.data.status)) {
                throw new Error(`Pages deployment failed: ${result.data.status}`);
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Pages deployment timed out.');
